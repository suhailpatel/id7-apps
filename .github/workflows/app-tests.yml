name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run build:preview
      - name: Verify new-app workflow
        run: |
          npm run new:app -- ci_sample "CI sample"
          npm run build:preview -- ci_sample
          npm run preview -- dist/ci_sample /tmp/id7-ci-preview
